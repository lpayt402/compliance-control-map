[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-control-map-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.19.0",
  "argon2-cffi==25.1.0",
  "email-validator==2.3.0",
  "fastapi==0.141.1",
  "filetype==1.2.0",
  "httpx2==2.10.0",
  "openai==3.2.0",
  "pydantic-ai-slim[openai]==2.33.0",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "PyYAML==6.0.3",
  "SQLAlchemy==2.0.51",
  "starlette==1.6.0",
  "tiktoken==0.14.0",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.11",
  "time-machine==3.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -p no:cacheprovider --basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"alembic/versions/*.py" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
